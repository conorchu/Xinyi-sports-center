<!DOCTYPE html>
<html lang="zh-Hant">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>MindAR Official Test</title>


    <!-- =====================================================
         Three.js Import Map
         ===================================================== -->

    <script type="importmap">
    {
        "imports": {
            "three":
                "https://unpkg.com/three@0.160.0/build/three.module.js",

            "three/addons/":
                "https://unpkg.com/three@0.160.0/examples/jsm/"
        }
    }
    </script>


    <style>

        * {
            box-sizing: border-box;
        }


        html,
        body {

            margin: 0;

            padding: 0;

            width: 100%;

            height: 100%;

            overflow: hidden;

            background: #000;

            font-family:
                Arial,
                "Noto Sans TC",
                sans-serif;

        }


        #ar-container {

            position: fixed;

            inset: 0;

            width: 100%;

            height: 100%;

            z-index: 1;

        }


        #status {

            position: fixed;

            top: 20px;

            left: 50%;

            transform:
                translateX(-50%);

            width: calc(100% - 40px);

            max-width: 500px;

            padding: 16px 20px;

            background:
                rgba(0, 0, 0, 0.8);

            color: white;

            border-radius: 16px;

            text-align: center;

            z-index: 20;

            font-size: 17px;

            line-height: 1.5;

        }


        #start-screen {

            position: fixed;

            inset: 0;

            display: flex;

            align-items: center;

            justify-content: center;

            background:
                rgba(0, 0, 0, 0.94);

            z-index: 30;

        }


        #start-card {

            width: calc(100% - 40px);

            max-width: 420px;

            padding: 30px 24px;

            background: white;

            border-radius: 20px;

            text-align: center;

        }


        #start-card h1 {

            margin: 0 0 12px 0;

        }


        #start-card p {

            color: #555;

            line-height: 1.6;

        }


        #start-button {

            width: 100%;

            margin-top: 15px;

            padding: 15px;

            border: none;

            border-radius: 12px;

            background: #111;

            color: white;

            font-size: 18px;

            font-weight: bold;

        }


        #success {

            position: fixed;

            top: 50%;

            left: 50%;

            transform:
                translate(-50%, -50%);

            width: calc(100% - 60px);

            max-width: 420px;

            padding: 30px 20px;

            background:
                rgba(0, 160, 80, 0.94);

            color: white;

            border-radius: 20px;

            text-align: center;

            z-index: 25;

            display: none;

        }


        #success.show {

            display: block;

        }


        #success h1 {

            margin: 0 0 10px 0;

            font-size: 30px;

        }


    </style>

</head>


<body>


    <!-- =====================================================
         AR Container
         ===================================================== -->

    <div id="ar-container"></div>


    <!-- =====================================================
         Status
         ===================================================== -->

    <div id="status">
        尚未啟動
    </div>


    <!-- =====================================================
         Start Screen
         ===================================================== -->

    <div id="start-screen">

        <div id="start-card">

            <h1>
                🎯 MindAR 官方測試
            </h1>

            <p>
                這次只測試 MindAR Image Target。
            </p>

            <p>
                不使用你的 targets-v2.mind、
                route.js、Goose 或 Arrow。
            </p>

            <button id="start-button">
                開啟 AR 相機
            </button>

        </div>

    </div>


    <!-- =====================================================
         Success
         ===================================================== -->

    <div id="success">

        <h1>
            🎯 TARGET FOUND
        </h1>

        <div>
            MindAR 官方 Target 辨識成功
        </div>

    </div>


    <!-- =====================================================
         Main
         ===================================================== -->

    <script type="module">

        import * as THREE from "three";


        import {
            MindARThree
        } from
            "https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-three.prod.js";


        // ====================================================
        // Official MindAR Target
        // ====================================================

        const TARGET_FILE =
            "https://cdn.jsdelivr.net/gh/hiukim/mind-ar-js@1.2.5/examples/image-tracking/assets/card-example/card.mind";


        // ====================================================
        // HTML
        // ====================================================

        const container =
            document.querySelector(
                "#ar-container"
            );


        const status =
            document.querySelector(
                "#status"
            );


        const startScreen =
            document.querySelector(
                "#start-screen"
            );


        const startButton =
            document.querySelector(
                "#start-button"
            );


        const success =
            document.querySelector(
                "#success"
            );


        // ====================================================
        // 初始化 MindAR
        // ====================================================

        let mindarThree;


        try {

            console.log(
                "建立 MindAR..."
            );


            mindarThree =
                new MindARThree({

                    container:
                        container,

                    imageTargetSrc:
                        TARGET_FILE,

                    maxTrack:
                        1

                });


            console.log(
                "MindAR 建立完成"
            );


            status.textContent =
                "MindAR 已準備完成，請按「開啟 AR 相機」";


        } catch (error) {

            console.error(
                "MindAR 建立失敗：",
                error
            );


            status.textContent =
                "❌ MindAR 建立失敗";


        }


        // ====================================================
        // Three.js
        // ====================================================

        let renderer;
        let scene;
        let camera;
        let anchor;


        if (mindarThree) {

            renderer =
                mindarThree.renderer;

            scene =
                mindarThree.scene;

            camera =
                mindarThree.camera;


            // =================================================
            // Light
            // =================================================

            const light =
                new THREE.HemisphereLight(
                    0xffffff,
                    0xbbbbbb,
                    3
                );


            scene.add(
                light
            );


            // =================================================
            // Target 0
            // =================================================

            anchor =
                mindarThree.addAnchor(
                    0
                );


            // =================================================
            // 測試方塊
            // =================================================

            const geometry =
                new THREE.BoxGeometry(
                    0.3,
                    0.3,
                    0.3
                );


            const material =
                new THREE.MeshBasicMaterial({

                    color:
                        0x00ff00

                });


            const cube =
                new THREE.Mesh(
                    geometry,
                    material
                );


            cube.position.set(
                0,
                0,
                0
            );


            anchor.group.add(
                cube
            );


            // =================================================
            // Target Found
            // =================================================

            anchor.onTargetFound =
                () => {

                    console.log(
                        "================================"
                    );


                    console.log(
                        "🎯 OFFICIAL TARGET 0 FOUND"
                    );


                    console.log(
                        "================================"
                    );


                    status.textContent =
                        "🎯 TARGET 0 FOUND";


                    success.classList.add(
                        "show"
                    );

                };


            // =================================================
            // Target Lost
            // =================================================

            anchor.onTargetLost =
                () => {

                    console.log(
                        "Target 0 Lost"
                    );


                    status.textContent =
                        "Target 暫時離開鏡頭";


                    success.classList.remove(
                        "show"
                    );

                };

        }


        // ====================================================
        // Start AR
        // ====================================================

        async function startAR() {

            if (!mindarThree) {

                return;

            }


            try {

                startButton.disabled =
                    true;


                startButton.textContent =
                    "正在開啟相機…";


                status.textContent =
                    "正在啟動相機…";


                console.log(
                    "開始 MindAR..."
                );


                // =============================================
                // 啟動
                // =============================================

                await mindarThree.start();


                console.log(
                    "✅ MindAR 啟動成功"
                );


                status.textContent =
                    "請對準官方 card.png";


                // =============================================
                // Render
                // =============================================

                renderer.setAnimationLoop(
                    () => {

                        renderer.render(
                            scene,
                            camera
                        );

                    }
                );


                // =============================================
                // 隱藏開始畫面
                // =============================================

                startScreen.style.display =
                    "none";


            } catch (error) {

                console.error(
                    "❌ MindAR 啟動失敗：",
                    error
                );


                status.textContent =
                    "❌ AR 啟動失敗：" +
                    error.message;


                startButton.disabled =
                    false;


                startButton.textContent =
                    "重新開啟 AR";

            }

        }


        // ====================================================
        // Button
        // ====================================================

        startButton.addEventListener(
            "click",
            startAR
        );


        // ====================================================
        // Console
        // ====================================================

        console.log(
            "================================"
        );


        console.log(
            "MindAR Official Test Ready"
        );


        console.log(
            "Target:"
        );


        console.log(
            TARGET_FILE
        );


        console.log(
            "================================"
        );

    </script>


</body>

</html>
