<!DOCTYPE html>

<html lang="zh-Hant">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    >

    <title>
        MindAR Target Test
    </title>


    <!-- =====================================================
         Three.js Import Map
         
         MindAR 內部也會使用 "three"
         所以這裡統一指定同一份 Three.js
         ===================================================== -->

    <script type="importmap">

    {
        "imports": {

            "three":
                "https://unpkg.com/three@0.160.0/build/three.module.js",

            "three/addons/":
                "https://unpkg.com/three@0.160.0/examples/jsm/"

        }
    }

    </script>


    <style>

        * {
            box-sizing: border-box;
        }


        html,
        body {

            margin: 0;

            padding: 0;

            width: 100%;

            height: 100%;

            overflow: hidden;

            background: #000;

            font-family:
                Arial,
                "Noto Sans TC",
                sans-serif;

        }


        #ar-container {

            position: fixed;

            inset: 0;

            width: 100%;

            height: 100%;

            z-index: 1;

        }


        /* =================================================
           上方測試資訊
           ================================================= */

        #status-panel {

            position: fixed;

            top: 20px;

            left: 50%;

            transform:
                translateX(-50%);

            width: calc(100% - 40px);

            max-width: 500px;

            padding: 16px 20px;

            background:
                rgba(0, 0, 0, 0.75);

            color: white;

            border-radius: 16px;

            text-align: center;

            z-index: 10;

            backdrop-filter:
                blur(8px);

        }


        #title {

            font-size: 20px;

            font-weight: bold;

            margin-bottom: 8px;

        }


        #status {

            font-size: 16px;

            line-height: 1.5;

        }


        #detail {

            margin-top: 8px;

            font-size: 13px;

            opacity: 0.8;

        }


        /* =================================================
           開始畫面
           ================================================= */

        #start-screen {

            position: fixed;

            inset: 0;

            display: flex;

            align-items: center;

            justify-content: center;

            background:
                rgba(0, 0, 0, 0.92);

            z-index: 20;

        }


        #start-card {

            width: calc(100% - 40px);

            max-width: 420px;

            padding: 30px 24px;

            background: white;

            border-radius: 20px;

            text-align: center;

        }


        #start-card h1 {

            margin:
                0 0 10px 0;

            font-size: 26px;

        }


        #start-card p {

            margin:
                8px 0;

            color: #555;

            line-height: 1.6;

        }


        #start-button {

            width: 100%;

            margin-top: 20px;

            padding: 15px;

            border: none;

            border-radius: 12px;

            background: #111;

            color: white;

            font-size: 18px;

            font-weight: bold;

            cursor: pointer;

        }


        #start-button:disabled {

            opacity: 0.6;

        }


        /* =================================================
           Target Found 成功提示
           ================================================= */

        #success {

            position: fixed;

            left: 50%;

            top: 50%;

            transform:
                translate(-50%, -50%);

            width: calc(100% - 60px);

            max-width: 420px;

            padding: 30px 20px;

            background:
                rgba(0, 150, 70, 0.92);

            color: white;

            border-radius: 20px;

            text-align: center;

            z-index: 15;

            display: none;

        }


        #success.show {

            display: block;

        }


        #success-title {

            font-size: 32px;

            font-weight: bold;

            margin-bottom: 10px;

        }


        #success-detail {

            font-size: 18px;

        }


    </style>

</head>


<body>


    <!-- =====================================================
         MindAR Container
         ===================================================== -->

    <div id="ar-container"></div>


    <!-- =====================================================
         狀態
         ===================================================== -->

    <div id="status-panel">

        <div id="title">
            MindAR Target 測試
        </div>

        <div id="status">
            尚未啟動
        </div>

        <div id="detail">
            Target：0
        </div>

    </div>


    <!-- =====================================================
         開始畫面
         ===================================================== -->

    <div id="start-screen">

        <div id="start-card">

            <h1>
                🎯 MindAR 測試
            </h1>

            <p>
                這個頁面只測試
                <br>
                Target 0 是否能被辨識
            </p>

            <p>
                不包含 Goose、Arrow、
                route.js 或其他功能。
            </p>

            <button id="start-button">
                開啟 AR 相機
            </button>

        </div>

    </div>


    <!-- =====================================================
         Target Found 成功畫面
         ===================================================== -->

    <div id="success">

        <div id="success-title">
            🎯 TARGET 0 FOUND
        </div>

        <div id="success-detail">
            MindAR 已成功辨識標地圖
        </div>

    </div>


    <!-- =====================================================
         MindAR Test
         ===================================================== -->

    <script type="module">


        // ====================================================
        // Three.js
        // ====================================================

        import * as THREE from "three";


        // ====================================================
        // MindAR
        // ====================================================

        import {
            MindARThree
        } from
            "https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-three.prod.js";


        // ====================================================
        // Target 檔案
        // ====================================================

        const TARGET_FILE =
            "./targets-v2.mind";


        // ====================================================
        // HTML
        // ====================================================

        const container =
            document.querySelector(
                "#ar-container"
            );


        const startScreen =
            document.querySelector(
                "#start-screen"
            );


        const startButton =
            document.querySelector(
                "#start-button"
            );


        const status =
            document.querySelector(
                "#status"
            );


        const detail =
            document.querySelector(
                "#detail"
            );


        const success =
            document.querySelector(
                "#success"
            );


        // ====================================================
        // MindAR
        // ====================================================

        const mindarThree =
            new MindARThree({

                container:
                    container,

                imageTargetSrc:
                    TARGET_FILE,

                maxTrack:
                    1,

                uiScanning:
                    "yes",

                uiLoading:
                    "yes"

            });


        // ====================================================
        // Three.js
        // ====================================================

        const {
            renderer,
            scene,
            camera
        } = mindarThree;


        // ====================================================
        // 燈光
        // ====================================================

        const light =
            new THREE.HemisphereLight(
                0xffffff,
                0xbbbbbb,
                3
            );


        scene.add(
            light
        );


        // ====================================================
        // Target 0
        // ====================================================

        const anchor =
            mindarThree.addAnchor(
                0
            );


        // ====================================================
        // 建立一個簡單的測試方塊
        // ====================================================
        //
        // 這不是 Goose。
        //
        // 只是用來確認 Target Found 後
        // Three.js 是否真的在 Target 上建立物件。
        //
        // ====================================================

        const geometry =
            new THREE.BoxGeometry(
                0.3,
                0.3,
                0.3
            );


        const material =
            new THREE.MeshBasicMaterial({

                color:
                    0x00ff00

            });


        const cube =
            new THREE.Mesh(
                geometry,
                material
            );


        cube.position.set(
            0,
            0,
            0
        );


        anchor.group.add(
            cube
        );


        // ====================================================
        // Target Found
        // ====================================================

        anchor.onTargetFound =
            () => {

                console.log(
                    "================================"
                );


                console.log(
                    "🎯 TARGET 0 FOUND"
                );


                console.log(
                    "MindAR 已成功辨識 Target 0"
                );


                console.log(
                    "================================"
                );


                status.textContent =
                    "🎯 TARGET 0 已辨識";


                detail.textContent =
                    "手機端 MindAR Target Tracking 成功";


                success.classList.add(
                    "show"
                );

            };


        // ====================================================
        // Target Lost
        // ====================================================

        anchor.onTargetLost =
            () => {

                console.log(
                    "Target 0 Lost"
                );


                status.textContent =
                    "Target 0 暫時離開鏡頭";


                success.classList.remove(
                    "show"
                );

            };


        // ====================================================
        // 啟動 AR
        // ====================================================

        async function startAR() {

            try {

                // ------------------------------------------------
                // 按鈕
                // ------------------------------------------------

                startButton.disabled =
                    true;


                startButton.textContent =
                    "正在開啟相機…";


                status.textContent =
                    "正在啟動 MindAR…";


                detail.textContent =
                    "正在載入 targets-v2.mind";


                // ------------------------------------------------
                // 啟動 MindAR
                // ------------------------------------------------

                await mindarThree.start();


                // ------------------------------------------------
                // Renderer
                // ------------------------------------------------

                renderer.setAnimationLoop(
                    () => {

                        renderer.render(
                            scene,
                            camera
                        );

                    }
                );


                // ------------------------------------------------
                // 成功啟動
                // ------------------------------------------------

                console.log(
                    "================================"
                );


                console.log(
                    "MindAR Test Started"
                );


                console.log(
                    "Target File:",
                    TARGET_FILE
                );


                console.log(
                    "Target Index: 0"
                );


                console.log(
                    "================================"
                );


                status.textContent =
                    "請對準 Target 0";


                detail.textContent =
                    "請慢慢前後移動手機";


                // ------------------------------------------------
                // 隱藏開始畫面
                // ------------------------------------------------

                startScreen.style.display =
                    "none";


            } catch (error) {

                console.error(
                    "❌ MindAR 啟動失敗",
                    error
                );


                status.textContent =
                    "❌ AR 啟動失敗";


                detail.textContent =
                    error.message ||
                    "請檢查相機權限";


                startButton.disabled =
                    false;


                startButton.textContent =
                    "重新開啟 AR";

            }

        }


        // ====================================================
        // Button
        // ====================================================

        startButton.addEventListener(
            "click",
            startAR
        );


        // ====================================================
        // 頁面載入
        // ====================================================

        console.log(
            "================================"
        );


        console.log(
            "MindAR Target Test Ready"
        );


        console.log(
            "Target File:",
            TARGET_FILE
        );


        console.log(
            "Target Index: 0"
        );


        console.log(
            "================================"
        );


    </script>


</body>

</html>
