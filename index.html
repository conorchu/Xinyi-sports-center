<!DOCTYPE html>

<html lang="zh-Hant">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        信義運動中心 AR 導引
    </title>

    <link
        rel="stylesheet"
        href="./style.css"
    >

</head>


<body>


    <!-- =====================================================
         AR 畫面
         ===================================================== -->

    <div id="ar-container"></div>


    <!-- =====================================================
         開始畫面
         ===================================================== -->

    <div
        id="start-screen"
        class="overlay"
    >

        <div class="card">

            <div class="logo">
                🏸
            </div>


            <h1>
                信義運動中心
            </h1>


            <p>
                AR 導引
            </p>


            <p class="description">
                請開啟相機，並對準指定圖片
                <br>
                系統會透過 AR 箭頭引導你前往目的地
            </p>


            <button
                id="start-button"
            >
                開啟 AR 相機
            </button>


            <div
                id="status"
                class="status"
            >
                尚未啟動
            </div>

        </div>

    </div>


    <!-- =====================================================
         AR HUD
         ===================================================== -->

    <div
        id="hud"
        class="hud"
    >

        <div class="hud-top">

            <div class="location-box">

                <span class="label">
                    目前位置
                </span>

                <span
                    id="current-location"
                    class="location"
                >
                    尚未定位
                </span>

            </div>

        </div>


        <div class="hud-bottom">

            <div
                id="instruction"
                class="instruction"
            >
                請對準場景圖片
            </div>

        </div>

    </div>


    <!-- =====================================================
         抵達畫面
         ===================================================== -->

    <div
        id="arrival"
        class="arrival"
    >

        <div class="arrival-card">

            <div class="arrival-icon">
                🏸
            </div>


            <h2>
                已抵達
            </h2>


            <p>
                歡迎來到信義運動中心
            </p>

        </div>

    </div>


    <!-- =====================================================
         JavaScript
         ===================================================== -->

    <script type="module">

        import "./route.js";

        import "./app.js";

    </script>


</body>

</html>
